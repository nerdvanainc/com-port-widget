# Build and unit tests on Windows. No secrets are used.
name: tests
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build ComPortWidget.sln -c Release
      - name: Test
        run: dotnet test ComPortWidget.sln -c Release --no-build
